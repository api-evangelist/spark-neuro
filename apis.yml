aid: spark-neuro
name: SPARK Neuro
description: >-
  SPARK Neuro is a New York City neuroscience company that quantifies brain data with EEG
  and machine learning, for both clinical care and commercial audience measurement. Its
  clinical arm, SPARK Medical, pairs FDA-cleared EEG hardware with deep-learning models to
  produce objective biomarkers for Alzheimer's disease, traumatic brain injury and
  concussion, Parkinson's disease, ALS, and mental-health conditions, and ships a
  push-button test-and-report software platform aimed at clinicians, researchers and
  pharmaceutical trial operations. Its commercial arm, Spark MEDIA, applies the same
  biometric measurement to advertising and entertainment, reading emotional and attentional
  response to content. A third product, Spark Predict, is a conversational analytics
  interface over the company's healthcare claims intelligence engine, marketed to payers and
  providers. The company was founded by CEO Spencer Gerrol and has raised more than $35M.
  SPARK Neuro publishes no public developer program, API reference, or machine-readable
  contract; its software reaches customers as a delivered product rather than as an API.
